openapi: 3.0.0
info:
  title: API Subastas
  version: "1.1"
  description: Endpoints para crear, listar, pujar y comprar subastas, así como obtener el historial de subastas de usuarios.

servers:
  - url: https://auction-deploy-272361825762.us-east1.run.app
    description: Servidor de producción

paths:
  /auctions:
    get:
      summary: Listar subastas abiertas
      description: Obtiene todas las subastas abiertas en el sistema
      responses:
        '200':
          description: Lista de subastas abiertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Auction"
                example:
                  data:
                    - id: "1"
                      name: "Subasta Espada Épica"
                      description: "Una espada legendaria"
                      startingPrice: 500
                      currentPrice: 600
                      itemId: "101"
                      sellerId: "1"
                      status: OPEN
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

    post:
      summary: Crear una subasta
      description: Crea una nueva subasta usando los datos del body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Auction"
            example:
              name: "Subasta Mago de Fuego"
              description: "Entrenado en la magia elemental"
              startingPrice: 700
              buyNowPrice: 1000
              durationHours: 48
              itemId: "103"
              username: "usuario1"
      responses:
        '201':
          description: Subasta creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Auction"
                example:
                  data:
                    id: "3"
                    name: "Subasta Mago de Fuego"
                    description: "Entrenado en la magia elemental"
                    startingPrice: 700
                    currentPrice: 700
                    buyNowPrice: 1000
                    itemId: "103"
                    sellerId: "2"
                    status: OPEN
        '400':
          description: Error en la creación
          content:
            application/json:
              examples:
                token:
                  value: { error: "Token no proporcionado" }
                credits:
                  value: { error: "Créditos insuficientes" }
                item_owner:
                  value: { error: "El item no pertenece al usuario" }
                item_unavailable:
                  value: { error: "El item no está disponible para subasta" }
                price_invalid:
                  value: { error: "El precio de compra rápida debe ser mayor al precio inicial" }
                startingPrice_invalid:
                  value: { error: "El precio inicial debe ser mínimo 1" }

  /auctions/{id}:
    get:
      summary: Obtener subasta por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID de la subasta
      responses:
        '200':
          description: Subasta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"
              example:
                id: "1"
                name: "Subasta Espada Épica"
                description: "Una espada legendaria"
                startingPrice: 500
                currentPrice: 600
                buyNowPrice: 800
                itemId: "101"
                sellerId: "1"
                status: OPEN
        '404':
          description: Subasta no encontrada
          content:
            application/json:
              example:
                error: "Auction not found"
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

  /auctions/{id}/bid:
    post:
      summary: Hacer una puja en la subasta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                username:
                  type: string
              required:
                - amount
                - username
            example:
              amount: 650
              username: "usuario2"
      responses:
        '200':
          description: Puja realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                example:
                  data:
                    success: true
        '400':
          description: Error en la puja
          content:
            application/json:
              examples:
                token:
                  value: { error: "Token no proporcionado" }
                auction_closed:
                  value: { error: "Auction not found" }
                own_auction:
                  value: { error: "El creador no puede pujar en su propia subasta" }
                buyNow_exceeded:
                  value: { error: "La puja iguala o supera el precio de compra rápida. Usa el botón de compra rápida" }
                insufficient_credits:
                  value: { error: "Créditos insuficientes" }

  /auctions/{id}/buynow:
    post:
      summary: Compra inmediata de una subasta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
              required:
                - username
            example:
              username: "usuario2"
      responses:
        '200':
          description: Compra realizada
          content:
            application/json:
              example:
                data:
                  success: true
                  message: "Compra rápida realizada correctamente"
        '400':
          description: No se pudo realizar la compra
          content:
            application/json:
              example:
                error: "No se pudo realizar la compra rápida"
        '403':
          description: Créditos insuficientes
          content:
            application/json:
              example:
                error: "Créditos insuficientes"
        '404':
          description: Subasta no encontrada
          content:
            application/json:
              example:
                error: "Auction not found"

  /auctions/{id}/bids:
    get:
      summary: Obtener todas las pujas de una subasta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de pujas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bid"
              example:
                - id: "1"
                  auctionId: "1"
                  userId: "2"
                  amount: 550
                  createdAt: "2025-09-06T22:00:00Z"
        '404':
          description: Subasta no encontrada
          content:
            application/json:
              example:
                error: "Auction not found"
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

  /auctions/me:
    get:
      summary: Subastas del usuario actual
      responses:
        '200':
          description: Lista de subastas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Auction"
              example:
                data: []
        '401':
          description: Token no proporcionado
          content:
            application/json:
              example:
                error: "Token no proporcionado"
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

  /auctions/history/purchased/{username}:
    get:
      summary: Subastas compradas por usuario
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de subastas compradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Auction"
              example:
                data:
                  - id: "3"
                    name: "Subasta Mago de Fuego"
                    description: "Entrenado en la magia elemental"
                    startingPrice: 700
                    currentPrice: 700
                    buyNowPrice: 1000
                    itemId: "103"
                    sellerId: "2"
                    status: SOLD
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

  /auctions/history/sold/{username}:
    get:
      summary: Subastas vendidas por usuario
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de subastas vendidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Auction"
              example:
                data:
                  - id: "1"
                    name: "Subasta Espada Épica"
                    description: "Una espada legendaria"
                    startingPrice: 500
                    currentPrice: 600
                    buyNowPrice: 800
                    itemId: "101"
                    sellerId: "1"
                    status: SOLD
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

components:
  schemas:
    Auction:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        startingPrice:
          type: number
        currentPrice:
          type: number
        buyNowPrice:
          type: number
        itemId:
          type: string
        sellerId:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED, SOLD]
        durationHours:
          type: number
    Bid:
      type: object
      properties:
        id:
          type: string
        auctionId:
          type: string
        userId:
          type: string
        amount:
          type: number
        createdAt:
          type: string
          format: date-time