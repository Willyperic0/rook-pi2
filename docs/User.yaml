openapi: 3.0.0
info:
  title: API Users
  version: "1.1"
  description: Endpoints para gestionar usuarios, obtener información por ID, el usuario actual autenticado y actualizar créditos.
servers:
  - url: http://136.112.163.5:1882/
    description: Servidor de producción

paths:
  /users/{id}:
    get:
      summary: Obtener usuario por ID
      description: Retorna la información de un usuario específico por su ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID del usuario a consultar
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "5"
                username: "Juan"
                email: "juan@email.com"
        '400':
          description: ID inválido
          content:
            application/json:
              example:
                error: "User ID is required"
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              example:
                error: "User not found"
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

  /users/me:
    get:
      summary: Obtener usuario actual
      description: Retorna la información del usuario autenticado mediante token.
      responses:
        '200':
          description: Datos del usuario actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "5"
                username: "Juan"
                email: "juan@email.com"
        '401':
          description: Usuario no autenticado
          content:
            application/json:
              example:
                error: "No token provided"
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              example:
                error: "User not found"
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

  /users/{nombreUsuario}/creditos:
    post:
      summary: Actualizar créditos de un usuario
      description: Permite modificar los créditos de un usuario específico por su nombre de usuario.
      parameters:
        - name: nombreUsuario
          in: path
          required: true
          schema:
            type: string
          description: Nombre de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                creditos:
                  type: number
                  description: Nueva cantidad de créditos
              required:
                - creditos
            example:
              creditos: 500
      responses:
        '200':
          description: Créditos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Datos incompletos o inválidos
          content:
            application/json:
              example:
                error: "Nombre de usuario o créditos no proporcionados"
        '404':
          description: Usuario no encontrado o no actualizado
          content:
            application/json:
              example:
                error: "Usuario no encontrado o no se pudo actualizar"
        '500':
          description: Error interno
          content:
            application/json:
              example:
                error: "Error inesperado"

components:
  schemas:
    User:
      type: object
      description: Representa un usuario del sistema
      properties:
        id:
          type: string
          description: Identificador único del usuario
        username:
          type: string
          description: Nombre de usuario
        email:
          type: string
          description: Correo electrónico del usuario
        creditos:
          type: number
          description: Créditos actuales del usuario
      required:
        - id
        - username
        - email